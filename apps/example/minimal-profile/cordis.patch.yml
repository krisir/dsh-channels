# Example profile patch — @krischoichoi/dsh-channels bundle, QQ-only override.
#
# This is the *user* profile patch (cordis.patch.yml) that overrides the rows
# inserted by the @krischoichoi/dsh-channels bundle. A Harness patch REPLACES the whole
# target config — it is NOT a deep merge — so each `config:` block below must
# carry the complete config for that plugin, not just the key you want to
# change.
#
# This file shows:
#   - disabling the unused channels (weixin / dingtalk / lark), and
#   - overriding channels-qq with its full config. The QQ config carries
#     only the credential *reference* (`appSecretRef`); the real secret lives
#     in `ctx.credentials` and is never written here.

- id: channels-weixin
  name: '@krischoichoi/dsh-channels/weixin'
  disabled: true

- id: channels-dingtalk
  name: '@krischoichoi/dsh-channels/dingtalk'
  disabled: true

- id: channels-lark
  name: '@krischoichoi/dsh-channels/lark'
  disabled: true

- id: channels-telegram
  name: '@krischoichoi/dsh-channels/telegram'
  disabled: true

- id: channels-qq
  name: '@krischoichoi/dsh-channels/qq'
  inject:
    - channels
    - credentials
    - channelControl
  config:
    accountId: main
    appId: "YOUR_QQ_APP_ID"
    appSecretRef: QQBOT_APP_SECRET
    markdownSupport: false
    streaming:
      enabled: true
      throttleMs: 500
    dedup:
      enabled: true
      windowMs: 5000
    startupTimeoutMs: 15000
