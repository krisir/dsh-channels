# DSH Bundle patch — @krischoichoi/dsh-channels
#
# Inserts the ChannelService, the Harness bridge and the five official
# adapters into a DeepSeek Harness profile.
#
# Every channel below can be disabled through its own plugin config
# (e.g. `plugins.channels-weixin.enabled = false`).
#
# `inject` names follow the Harness public service surface at bundle time;
# adjust when the upstream service names change (converged in channel-harness).

- insert:
    - id: channels-service
      name: '@krischoichoi/dsh-channels/service'

    # Generic attachment compatibility backend.
    # Required for non-image channel attachments until Harness provides native
    # generic attachment support. Legacy v1 data remains readable even after a
    # native backend becomes available.
    - id: channels-files
      name: '@krischoichoi/dsh-channels/files'

    # Questions compose on the official `user-questions/request` waterfall.
    # Untagged root listeners are always ADMITTED, but the waterfall is
    # sequential and first-claim-wins: `@deepseek-ai/dsh-api-remotes` (official
    # web profile) registers its forwarding answerer at boot, before this row,
    # so the bridge PREPENDS its own answerer (see WaterfallQuestionBackend)
    # instead of relying on fiber order. Declined presentations still delegate
    # via `next()`.
    - id: channels-harness
      name: '@krischoichoi/dsh-channels/harness'
      inject:
        - channels
        - agents
        - agentDefaultModel
        - agentPresets
        - llm
        - commands

    - id: channels-control
      name: '@krischoichoi/dsh-channels/control'
      inject:
        - channels
        - credentials

    - id: channels-weixin
      name: '@krischoichoi/dsh-channels/weixin'
      inject:
        - channels
        - channelControl

    - id: channels-qq
      name: '@krischoichoi/dsh-channels/qq'
      inject:
        - channels
        - credentials
        - channelControl

    - id: channels-dingtalk
      name: '@krischoichoi/dsh-channels/dingtalk'
      inject:
        - channels
        - credentials
        - channelControl

    - id: channels-lark
      name: '@krischoichoi/dsh-channels/lark'
      inject:
        - channels
        - credentials
        - channelControl

    - id: channels-telegram
      name: '@krischoichoi/dsh-channels/telegram'
      inject:
        - channels
        - credentials
        - channelControl

    - id: channels-web
      name: '@krischoichoi/dsh-channels'
